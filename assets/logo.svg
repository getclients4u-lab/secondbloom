<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- SecondBloom logo: blooming flower rising from a crescent "change" arc -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a1626"/>
      <stop offset="100%" stop-color="#240a16"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9db8"/>
      <stop offset="100%" stop-color="#d95f88"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="192" height="192" rx="42" fill="url(#bg)"/>
  <!-- crescent change arc (bottom) -->
  <path d="M52 146 Q100 168 148 146" stroke="#e88aa5" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- petals -->
  <ellipse cx="100" cy="78" rx="17" ry="30" fill="url(#petal)" transform="rotate(0 100 100)"/>
  <ellipse cx="100" cy="78" rx="17" ry="30" fill="url(#petal)" transform="rotate(60 100 100)"/>
  <ellipse cx="100" cy="78" rx="17" ry="30" fill="url(#petal)" transform="rotate(120 100 100)"/>
  <ellipse cx="100" cy="78" rx="17" ry="30" fill="url(#petal)" transform="rotate(180 100 100)"/>
  <ellipse cx="100" cy="78" rx="17" ry="30" fill="url(#petal)" transform="rotate(240 100 100)"/>
  <ellipse cx="100" cy="78" rx="17" ry="30" fill="url(#petal)" transform="rotate(300 100 100)"/>
  <!-- inner -->
  <circle cx="100" cy="100" r="22" fill="#fdeef3"/>
  <circle cx="100" cy="100" r="13" fill="#c2456e"/>
  <!-- sparkle -->
  <path d="M156 52 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#e8c38f"/>
</svg>
